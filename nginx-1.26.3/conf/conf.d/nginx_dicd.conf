server {
    listen 80;
    server_name localhost 192.168.32.43;

    root "C:/Program Files/DICD_Management_System/frontend";
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI 분석 API - Gemini API 응답 대기를 위한 타임아웃 연장 (3분)
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}